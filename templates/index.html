<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Spotify Recommender</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
    }
    button {
      padding: 10px 18px;
      font-size: 16px;
      cursor: pointer;
    }
    #status {
      margin-top: 20px;
      white-space: pre-wrap;
    }
    a {
      color: #1DB954;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <h1>Spotify Recommender</h1>
  <p>Genera una playlist personalizada automáticamente.</p>

  {% if not logged %}
    <a href="/login">
      <button>🔑 Conectar con Spotify</button>
    </a>
  {% else %}
    <button type="button" onclick="createPlaylist()">🎧 Crear playlist</button>
  {% endif %}

  <div id="status"></div>

  <script>
    async function createPlaylist() {
      const status = document.getElementById("status");
      status.textContent = "⏳ Creando playlist…";

      try {
        const res = await fetch("/playlist", {
          method: "POST"
        });

        if (res.redirected) {
          window.location.href = res.url;
          return;
        }

        const data = await res.json();

        if (data.playlist_url) {
          status.innerHTML =
            `✅ Playlist creada con ${data.tracks} canciones\n\n` +
            `<a href="${data.playlist_url}" target="_blank">Abrir en Spotify</a>`;
        } else {
          status.textContent = JSON.stringify(data, null, 2);
        }
      } catch (err) {
        status.textContent = "❌ Error al crear la playlist";
      }
    }
  </script>

</body>
</html>
